// 플레이 로그 수집 서비스. /api/v1/events 를 받아 큐에 쌓고 배치로 분석 DB 에 씁니다.
//
// JPA 가 없습니다. 이 서비스가 하는 DB 일은 배치 INSERT 하나와 집계 SELECT 몇 개라 JdbcTemplate
// 으로 충분하고, 엔티티 매핑이 들어오면 기동이 느려지고 검증할 것이 늘어납니다.
// Security 도 없습니다. 이벤트 수집은 서명 검사(계정 토큰)로, 내부 API 는 공유 키로 잠급니다.
plugins {
	id 'org.springframework.boot'
}

description = 'Don\'t Touch Mine play-log ingestion and analysis'

// 대시보드 쿼리 문서를 그대로 리소스로 싣습니다 (GAME-976).
//
// 관리 화면의 분석 조회 API 는 docs/analytics-dashboards.md 의 SQL 을 실행합니다. 문서가 원본이고
// 코드에 사본이 없습니다. 사본을 두면 문서를 고친 사람이 코드를 잊거나 그 반대가 되고, 그 어긋남은
// 문서의 SQL 을 손으로 돌린 값과 관리 화면이 다른 숫자를 보일 때에야 드러납니다. 파싱 규칙은 DashboardQueryDocument 에,
// 문서 쪽 규칙은 그 문서의 "공통" 절에 있습니다.
def dashboardDoc = rootProject.file('docs/analytics-dashboards.md')
processResources {
	inputs.file(dashboardDoc)
	// Gradle 의 from() 은 없는 파일을 조용히 건너뜁니다. 그러면 jar 는 멀쩡히 나오고 컨테이너가 기동에서
	// 죽으므로(DashboardQueryDocument), Docker 컨텍스트에 docs/ 가 빠진 것을 여기서 잡습니다.
	doFirst {
		if (!dashboardDoc.isFile()) {
			throw new GradleException("docs/analytics-dashboards.md 가 없습니다. Dockerfile 의 COPY docs docs 를 확인하세요: ${dashboardDoc}")
		}
	}
	from(dashboardDoc) {
		into 'docs'
	}
}

// 통합 테스트가 이 스크립트를 MySQL 컨테이너에 마운트하고(AnalyticsIntegrationTest), 그것이 만든 계정의
// 권한을 검사합니다(AnalyticsReaderAccountTest). 컴파일 산출물에 들어가지 않는 파일이라 선언하지 않으면
// 어떤 up-to-date 검사도 이 변경을 잡지 못합니다. 실제로 스크립트를 고쳐도 테스트가 건너뛰어졌습니다.
//
// deploy 를 통째로 잡지 않는 이유는 nginx 설정이나 젠킨스 설치 스크립트만 고쳐도 테스트가 돌게 되기
// 때문입니다. 실제로 읽는 파일 하나만 잡습니다.
tasks.named('test') {
	inputs.file(rootProject.file('deploy/mysql-analytics/init/01-accounts.sh'))
			.withPropertyName('analyticsDbInit')
			.withPathSensitivity(PathSensitivity.RELATIVE)
}

dependencies {
	implementation project(':common')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
}
