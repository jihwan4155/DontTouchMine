// 세 모듈입니다 (GAME-980).
//
//   common     두 서비스가 함께 쓰는 것. 시각 형식, 오류 응답, 계정 토큰 서명. 실행 파일이 아님
//   app        계정·친구·초대·접속 상태·신고·피드백·알림·관리 화면. 이미지 donttouchmine-app
//   analytics  플레이 로그 수집과 집계. 이미지 donttouchmine-analytics
//
// 나눈 이유는 장애 격리입니다. 한 프로세스에 있으면 분석 쪽 메모리 폭주나 배포 재시작이 게임
// API 를 같이 죽입니다. app 과 analytics 는 서로를 참조하지 않고, 필요하면 내부 HTTP 로 말합니다.
rootProject.name = 'donttouchmine'

include 'common', 'app', 'analytics'
